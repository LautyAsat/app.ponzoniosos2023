apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk 35
    defaultConfig {
        applicationId "edu.unlpam.vet.ponzonosos"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    namespace "edu.unlpam.vet.ponzonosos"
    kotlinOptions {
        jvmTarget = '1.8'
    }

    viewBinding{
        enabled = true
    }

}

greendao {
    schemaVersion 3
    targetGenDir "src/main/java/"
}

// NUEVO BLOQUE: Declara la dependencia para asegurar que GreenDAO se ejecute primero
tasks.whenTaskAdded { task ->
    if (task.name == 'compileDebugKotlin' || task.name == 'compileReleaseKotlin') {
        task.dependsOn 'greendao'
    }
    // Si usas código Java junto con Kotlin, también podrías necesitar:
    // if (task.name == 'compileDebugJavaWithJavac' || task.name == 'compileReleaseJavaWithJavac') {
    //     task.dependsOn 'greendao'
    // }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'com.google.ar.sceneform:filament-android:1.17.1'
    testImplementation 'junit:junit:4.13.2'
    //androidTestImplementation 'androidx.test:runner:1.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    //androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.picasso:picasso:2.71828'

    //Librearias para galeria
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    //implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "com.github.bumptech.glide:volley-integration:4.8.0"
    implementation 'org.greenrobot:greendao:3.2.2'
    //Librerias para carrusell
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Zoom imagen
    implementation 'com.github.MikeOrtiz:TouchImageView:1.4.1'
    implementation 'io.github.chrisbanes:PhotoView:2.3.0'


}
